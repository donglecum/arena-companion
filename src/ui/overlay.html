<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crowd Favorites</title>
<style>
  /* Near-black and flat, matching the main app. Sizing and the element
     structure are a contract with the shell (fitOverlayHeight measures #panel,
     the whole panel is the drag handle, click-through follows the pointer).
     The panel answers "do I still need any of these?": needed rows are large,
     bright and coral-edged; won rows shrink and dim; unknown stays neutral.
     No glow: status is carried by size, weight and color. */
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('/fonts/inter-latin-wght.woff2') format('woff2'); }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    color-scheme: dark;
    font: 12px/1.35 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e6edf7;
  }
  /* Whole panel is the drag handle; the shell toggles click-through by hover. */
  #panel {
    -webkit-app-region: drag;
    box-sizing: border-box;
    padding: 8px 7px 7px;
    background: rgba(9, 12, 18, .96);
    border: 1px solid rgba(148, 163, 184, .24);
    border-radius: 10px;
  }
  #panel.hidden { display: none; }
  #head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 3px 7px 3px;
    border-bottom: 1px solid rgba(148, 163, 184, .12);
  }
  #head .dot { width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; flex: none; }
  #title {
    flex: 1;
    min-width: 0;
    font-weight: 600;
    font-size: 12px;
    color: #c4ccd8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* The answer: how many are still needed (or that none are), in the status color. */
  #summary {
    flex: none;
    font-size: 12px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  #summary:empty { display: none; }
  #summary.need { color: #fca5a5; }
  #summary.won { color: #2dd4bf; }
  #summary.unknown { color: #aab4c4; }
  #summary.preview { color: #fbbf24; }
  #list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  #list li { box-sizing: border-box; display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 3px 6px 3px 8px; border-radius: 8px; }
  /* Portrait over colored initials, so a missing image never leaves a hole. */
  .pic {
    position: relative;
    flex: none;
    overflow: hidden;
    border-radius: 7px;
    background: linear-gradient(135deg, hsl(var(--h, 215) 45% 28%), hsl(calc(var(--h, 215) + 50) 50% 13%));
  }
  .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ini { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: rgba(255, 255, 255, .62); }
  .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mark { flex: none; display: inline-flex; align-items: center; justify-content: center; }
  .mark svg { display: block; }

  /* Needed: the reason the panel exists. */
  li.needed { background: rgba(248, 113, 113, .11); box-shadow: inset 2px 0 0 #f87171; }
  li.needed .pic { width: 34px; height: 34px; box-shadow: 0 0 0 1.5px rgba(248, 113, 113, .6); }
  li.needed .ini { font-size: 12px; }
  li.needed .name { font-size: 13px; font-weight: 650; color: #fff; }
  li.needed .mark {
    height: 19px;
    padding: 0 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 650;
    color: #fecaca;
    background: rgba(248, 113, 113, .22);
  }
  /* Won: done. Still listed, but out of the way. */
  li.won .pic { width: 24px; height: 24px; margin: 0 5px; filter: saturate(.35) brightness(.6); }
  li.won .ini { font-size: 9px; }
  li.won .name { font-size: 11.5px; font-weight: 500; color: #8591a6; }
  li.won .mark { width: 18px; height: 18px; color: #2dd4bf; }
  /* Unknown (no win data): neutral, and clearly neither. */
  li.unknown .pic { width: 28px; height: 28px; margin: 0 3px; filter: saturate(.7); }
  li.unknown .ini { font-size: 10px; }
  li.unknown .name { font-size: 12px; font-weight: 550; color: #c4ccd8; }
  li.unknown .mark { width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 650; color: #aab4c4; background: rgba(148, 163, 184, .16); }
</style>
</head>
<body>
<div id="panel" class="hidden">
  <div id="head">
    <span class="dot"></span>
    <span id="title">Crowd Favorites</span>
    <span id="summary"></span>
  </div>
  <ul id="list"></ul>
</div>
<!-- The view model (row states, summary, preview samples) is shared with the main window. -->
<script src="js/crowd.js"></script>
<script>
(function () {
  'use strict';

  var model = window.ArenaCrowd;
  var panelEl = document.getElementById('panel');
  var titleEl = document.getElementById('title');
  var listEl = document.getElementById('list');
  var summaryEl = document.getElementById('summary');
  var rows = new Map();
  var lastPush = 0;

  var CHECK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  var MARK = { needed: 'Need', won: CHECK, unknown: '?' };

  function hue(text) {
    var h = 2166136261;
    for (var i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
    return (h >>> 0) % 360;
  }

  function makeRow() {
    var li = document.createElement('li');
    var pic = document.createElement('span');
    pic.className = 'pic';
    var ini = document.createElement('span');
    ini.className = 'ini';
    var img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.addEventListener('error', function () { img.style.visibility = 'hidden'; });
    pic.appendChild(ini);
    pic.appendChild(img);
    var name = document.createElement('span');
    name.className = 'name';
    var mark = document.createElement('span');
    mark.className = 'mark';
    li.appendChild(pic);
    li.appendChild(name);
    li.appendChild(mark);
    return { li: li, pic: pic, ini: ini, img: img, name: name, mark: mark, src: null, text: null, state: null, label: null };
  }

  // Diffed render: only touches the DOM/attributes that actually changed so
  // portraits are not reloaded on every poll.
  function applyStatus(status) {
    if (!status || typeof status !== 'object') return;
    var view = model.crowdModel(status);
    panelEl.classList.toggle('hidden', !view.active);
    if (titleEl.textContent !== view.heading) titleEl.textContent = view.heading;
    document.title = view.title + ' (' + view.rows.length + ')';
    if (!view.active) return;

    var seen = new Set();
    view.rows.forEach(function (r, index) {
      seen.add(r.key);
      var row = rows.get(r.key);
      if (!row) {
        row = makeRow();
        rows.set(r.key, row);
      }
      if (row.src !== r.portrait) {
        row.src = r.portrait;
        if (r.portrait) {
          row.img.style.visibility = '';
          row.img.src = r.portrait;
        } else {
          row.img.removeAttribute('src');
          row.img.style.visibility = 'hidden';
        }
      }
      if (row.text !== r.name) {
        row.text = r.name;
        row.name.textContent = r.name;
        row.ini.textContent = r.initials;
        row.pic.style.setProperty('--h', String(hue(r.name)));
      }
      if (row.state !== r.state || row.label !== r.label) {
        row.state = r.state;
        row.label = r.label;
        row.li.className = r.state;
        row.li.setAttribute('aria-label', r.label);
        row.mark.innerHTML = MARK[r.state];
      }
      if (listEl.children[index] !== row.li) listEl.insertBefore(row.li, listEl.children[index] || null);
    });

    rows.forEach(function (row, key) {
      if (seen.has(key)) return;
      row.li.remove();
      rows.delete(key);
    });

    if (summaryEl.textContent !== view.summary) summaryEl.textContent = view.summary;
    if (summaryEl.className !== view.tone) summaryEl.className = view.tone;
  }

  // Status is pushed by the Electron shell (double-encoded JSON, parsed here).
  window.__applyStatus = function (status) {
    lastPush = Date.now();
    applyStatus(status);
  };

  // Standalone fallback for browser/manual inspection: if the shell is not
  // pushing (e.g. page opened directly), poll the API itself.
  if (/^https?:$/.test(location.protocol)) {
    setInterval(async function () {
      if (Date.now() - lastPush < 4000) return; // shell is driving the overlay
      try {
        var res = await fetch('/api/status');
        if (res.ok) applyStatus(await res.json());
      } catch (err) {
        /* backend briefly unreachable; keep last state */
      }
    }, 2000);
  }
})();
</script>
</body>
</html>
